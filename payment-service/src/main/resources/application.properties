spring.application.name=payment-service

server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/bookmyshow_payment
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

#logging.level.org.flywaydb=DEBUG
#logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

payment.service.token=${PAYMENT_SERVICE_TOKEN}

booking.service.url=http://localhost:8080

spring.kafka.bootstrap-servers=localhost:9092

