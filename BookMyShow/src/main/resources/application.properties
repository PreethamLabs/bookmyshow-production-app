spring.application.name=bookmyshow

spring.datasource.url=jdbc:postgresql://localhost:5432/bookmyshow
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

payment.service.url=http://localhost:8081

payment.service.token=${PAYMENT_SERVICE_TOKEN}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8082}

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=bookmyshow-booking-service
spring.kafka.consumer.auto-offset-reset=earliest
